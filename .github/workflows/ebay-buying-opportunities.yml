name: eBay buying opportunity refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14,20 * * *'
permissions:
  contents: write
concurrency:
  group: ebay-buying-refresh
  cancel-in-progress: false
jobs:
  browse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve listings from official eBay Browse API
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_SCAN_CARD_LIMIT: '25'
          EBAY_RESULTS_PER_CARD: '15'
        run: python scripts/ebay_browse_feed.py
      - name: Publish updated feed
        run: |
          if ! git diff --quiet -- ebay-listings.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ebay-listings.json
            git commit -m "Refresh eBay active buying listings"
            git push
          fi
