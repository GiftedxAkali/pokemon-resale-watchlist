name: eBay buying opportunity refresh
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebay-buying-refresh
  cancel-in-progress: false
jobs:
  browse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check eBay Production authentication and Browse access
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import sys
          from urllib.error import HTTPError

          from scripts.ebay_browse_feed import search, token

          def check(stage, action):
              try:
                  return action()
              except Exception as error:
                  cause = error.__cause__
                  detail = f"HTTP {cause.code}" if isinstance(cause, HTTPError) else type(error).__name__
                  sys.exit(f"{stage} failed ({detail}).")

          access_token = check("Production authentication", token)
          print("Production authentication succeeded.")
          check("Browse search", lambda: search({
              "card": "Charizard ex", "number": "199/165", "set": "Scarlet Violet 151"
          }, access_token))
          print("Browse search succeeded. Listing results were discarded.")
          PY
